[build]
  publish = "dist"
  command = "npm run build"
[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Every article is listed on /blog/; its old numbered pages point there, and
# so do the topic filters that briefly lived on the home page.
[[redirects]]
  from = "/blog/page/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/"
  query = { topic = ":topic" }
  to = "/blog/?topic=:topic"
  status = 301
  force = true

# The Resume and Portfolio pages were removed; keep their old links working.
[[redirects]]
  from = "/resume"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/resume/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/portfolio/2026-04-26-http-file-generator/*"
  to = "/blog/2026-04-26-http-file-generator/"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/"
  status = 301

[[redirects]]
  from = "/portfolio/*"
  to = "/"
  status = 301

# The headers gatsby-adapter-netlify set: no caching of the pages themselves,
# a year for the fingerprinted assets.
[[headers]]
  for = "/*"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
    x-xss-protection = "1; mode=block"
    x-content-type-options = "nosniff"
    referrer-policy = "same-origin"
    x-frame-options = "DENY"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
