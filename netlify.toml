[build]
  publish = "dist"
  command = "npm run build"
[build.environment]
  NODE_VERSION = "22"

# Every article is listed on /blog/; its old numbered pages point there, and
# so do the topic filters that briefly lived on the home page.
[[redirects]]
  from = "/blog/page/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/"
  query = { topic = ":topic" }
  to = "/blog/?topic=:topic"
  status = 301
  force = true

# The Resume and Portfolio pages were removed; keep their old links working.
[[redirects]]
  from = "/resume"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/resume/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/portfolio/2026-04-26-http-file-generator/*"
  to = "/blog/2026-04-26-http-file-generator/"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/"
  status = 301

[[redirects]]
  from = "/portfolio/*"
  to = "/"
  status = 301

# No caching of the pages themselves, a year for the fingerprinted assets. The
# Content Security Policy is in each page's <meta> (astro.config.mjs), built from
# the hashes of its scripts; X-XSS-Protection is gone, as browsers dropped the
# filter it switched on and MDN advises against it.
[[headers]]
  for = "/*"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
    x-content-type-options = "nosniff"
    referrer-policy = "same-origin"
    x-frame-options = "DENY"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
