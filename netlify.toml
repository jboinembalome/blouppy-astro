[build]
  publish = "public"
  command = "npm run build"
[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# The article list moved to the home page; /blog and its old pages point there.
# Only these paths: the articles themselves stay under /blog/<slug>/.
[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog/page/*"
  to = "/"
  status = 301

# The Resume and Portfolio pages were removed; keep their old links working.
[[redirects]]
  from = "/resume"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/resume/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/portfolio/2026-04-26-http-file-generator/*"
  to = "/blog/2026-04-26-http-file-generator/"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/"
  status = 301

[[redirects]]
  from = "/portfolio/*"
  to = "/"
  status = 301
