# Checks every pull request as Netlify will build it, then checks the result:
# types, lint and format, the build, the built site (links, SEO tags, feeds),
# and the pages in a browser.
name: Build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      # Placeholder Algolia keys show the search button, so the tests can open
      # it; the tests answer its requests themselves.
      - run: npm run build
        env:
          GATSBY_ALGOLIA_APP_ID: e2e
          GATSBY_ALGOLIA_SEARCH_KEY: e2e
      - run: npm run test:site
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
